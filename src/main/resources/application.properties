# Base de datos: Postgres en Render (DATABASE_*), H2 en memoria como fallback local. El default
# de la URL (H2) y el del driver tienen que ser consistentes entre sí: antes el driver por
# defecto era el de Postgres contra una URL H2, así que el boot local sin DATABASE_* rompía
# (A10, CONTEXTO_E5.md §6).
spring.datasource.url=jdbc:${DATABASE_URL:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}


# Componentes
logistica.client=${LOGISTICA_URL:http://localhost:8084}
donadores.client=${DONADORES_URL:http://localhost:8081}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# show-sql imprime SQL multilinea a stdout, fuera del formato de logging: en Render con LOG_FORMAT=ecs
# rompe el contrato "una linea JSON por evento". Solo a demanda (SHOW_SQL=true).
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

#metricas_data_dog
# Sin default hardcodeado: quedó una key real en el historial de un repo de una org pública
# (CONTEXTO_E5.md §6/§9.4, pendiente de rotar). Local nunca manda nada mientras DATADOG_API_KEY
# quede vacía, igual que en los otros 3 componentes.
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.enabled=true
# La cuenta de Datadog del equipo está en el site US1: sin "uri" explícito, Micrometer ya apunta
# ahí por default (api.datadoghq.com). Antes decía us5.datadoghq.com, un site distinto: las
# métricas de este componente no estaban cayendo en la misma cuenta que las de los otros 3.
management.datadog.metrics.export.step=30s
management.metrics.tags.application=donaciones
# Antes hardcodeado a "production": local nunca mandaba nada mientras DATADOG_API_KEY quedara
# vacía, pero si alguna vez se mandaba desde local se mezclaba con las métricas reales en el
# mismo dashboard. Ahora usa la misma variable que ya usa el logging (APP_ENV), como los otros
# 3 componentes, para que logs y métricas queden correlacionados por el mismo valor de "env".
management.metrics.tags.env=${APP_ENV:local}

# H2 local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Server
server.port=${PORT:8083}

# Logging estructurado ECS (docs/logging-spec_v1.md del repo de Donadores).
# LOG_FORMAT vacio => consola legible (local); "ecs" en Render.
logging.structured.format.console=${LOG_FORMAT:}
logging.structured.ecs.service.name=${SERVICE_NAME:donaciones}
logging.structured.ecs.service.version=${SERVICE_VERSION:dev}
logging.structured.ecs.service.environment=${APP_ENV:local}

# Log centralizado (Better Stack, ver logback-spring.xml). Vacías => el servicio arranca igual y
# solo loguea por consola (comportamiento sin cambios). Se completan en Render por servicio.
# BETTERSTACK_SOURCE_TOKEN=
# BETTERSTACK_INGEST_URL=

logging.level.root=INFO
logging.level.ar.edu.utn.dds.k3003=INFO
# SQL de Hibernate solo a demanda (SQL_LOG_LEVEL=DEBUG).
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# Consola legible (solo aplica sin LOG_FORMAT; con ecs se ignora): %kvp agrega los campos de cada evento.
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(%-28.28logger{27}){cyan} %clr(:){faint} %m %kvp %clr([%X{trace.id:-}]){faint}%n%wEx
